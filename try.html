<body>
    <script> 
        document.write("Hello World! This is a test page.");
        padend(20, 'hi');
        function padend(totalLength, padString) {
            let str = "Hello    wwwwwwwwwww";
            while (str.length < totalLength) {
                str += padString;
            }
            document.write("<br>" + str);
        }


    </script>
