<!DOCTYPE html>
<html>
<head>
    <title>Static Home Page Using Frames</title>
</head>

<frameset rows="20%, 70%, 10%">
    
    <!-- Top Header Frame -->
    <frame src="header.html" name="headerFrame">

    <!-- Middle Section (Navigation + Content) -->
    <frameset cols="25%, 75%">
        <frame src="menu.html" name="menuFrame">
        <frame src="home.html" name="contentFrame">
    </frameset>

    <!-- Bottom Footer Frame -->
    <frame src="footer.html" name="footerFrame">

</frameset>

</html>
