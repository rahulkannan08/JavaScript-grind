<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopiing ccart</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>Gadget</h1>
    <div class="product-container">
        <div class="product">
            <input type="text" id="item-name" placeholder="enter a item"><br>
            <input type="number" id="item-price" placeholder="enter a price"><br>
            <button id="add-to-cart-btn">Add to Cart</button>
        </div>
       
    </div>
    <div class="cart-container">
        <h2>Your cart</h2>
        <ul id="cart-items">
        </ul>
        <p><strong>Total:$ <span id="total-price">0</span></strong></p>
        <button id="clear-cart-btn">Empty cart</button>
    </div>
    <script src="script.js"></script>
    <!-- <script src="try.js"></script> -->
</body>
</html>
