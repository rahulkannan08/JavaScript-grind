<!DOCTYPE html>
<html>
<head>
    <title>Simple Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
body {
    font-family: Arial;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
}

.box {
    width: 340px;
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
}

.product {
    margin: 10px 0;
}

button {
    margin-left: 10px;
}
    </style>
</head>
<body>
    <div class="box">
        <h1>Gadget Store</h1>

        <div class="product">
            Wireless Mouse - $20
            <button onclick="addToCart('Wireless Mouse',20)">Add</button>
        </div>

        <div class="product">
            Keyboard - $50
            <button onclick="addToCart('Keyboard',50)">Add</button>
        </div>

        <h2>Your Cart</h2>
        <ul id="cart"></ul>

        <p>Total: $<span id="total">0</span></p>

        <button onclick="clearCart()">Clear Cart</button>
    </div>

    <script >
        
let total = 0;

function addToCart(name, price) {

    let li = document.createElement("li");
    li.textContent = name + " - $" + price;

    document.getElementById("cart").appendChild(li);

    total += price;
    document.getElementById("total").textContent = total;
}

function clearCart() {
    document.getElementById("cart").innerHTML = "";
    total = 0;
    document.getElementById("total").textContent = total;
}

    </script>
</body>
</html>
