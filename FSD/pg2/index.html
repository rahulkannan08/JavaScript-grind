<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopiing ccart</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h1>Gadget</h1>
    <div class="product-container">
        <div class="product">
            <span>Wpro 1 - $20</span>
            <button onclick="addToCart('mouse',20)">Add to Cart</button>
        </div>
        <div class="product">
            <span>Wpro 2 - $40</span>
            <button onclick="addToCart('keyboard',4)">Add to Cart</button>
        </div>
    </div>
    <div class="cart-container">
        <h2>Your cart</h2>
        <ul id="cart-items">
        </ul>
        <p><strong>Total:$ <span id="total-price">0</span></strong></p>
        <button onclick="clearCart()">Empty cart</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
