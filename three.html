<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="myCanvas" width="200" height="100" style="border: 10px solid #f50404;"></canvas>
</body>
<script>
    const c= document.getElementById("myCanvas");
    const ctx = c.getContext("2d");
    ctx.moveTo(0,0);
    ctx.lineTo(200,100);
    ctx.stroke();
    ctx.font = "30px Arial";
    ctx.fillText("Hello",130,50)
    ctx.strokeText("Hello",130,80)
    ctx.strokeText("byeeee",10,50);
    const grd = ctx.createLinearGradient(0,0,200,0);
    grd.addColorStop(0,"red");
    grd.addColorStop(1,"white");
    ctx.fillStyle = grd;
    ctx.fillRect(10,10,150,80);

    </script>
</html>
